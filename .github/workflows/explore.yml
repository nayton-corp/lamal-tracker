name: Référentiels (génération temporaire sur la branche)
on:
  push:
    branches: [claude/project-thread-7bxcj9]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx --tsconfig tsconfig.json scripts/build-reference.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/infrastructure/reference/data
          git commit -m "Référentiels officiels générés en CI" || exit 0
          git push origin HEAD:claude/project-thread-7bxcj9
