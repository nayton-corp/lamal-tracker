name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  real-ofsp-data:
    # Vérifie l'import sur le VRAI fichier de primes publié par l'OFSP (format, colonnes, codes).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Import du fichier OFSP courant
        env:
          DATABASE_PATH: /tmp/ofsp-check.db
        run: |
          for i in 1 2 3; do pnpm cli download && exit 0; echo "nouvel essai dans 30 s"; sleep 30; done; exit 1
      - name: Import des archives des années précédentes (ancien format)
        env:
          DATABASE_PATH: /tmp/ofsp-check.db
        run: pnpm cli download-archives
